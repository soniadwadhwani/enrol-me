<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enrol Me - Explore all you can be</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            background: white;
            border-radius: 20px;
            padding: 60px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }

        .logo {
            margin-bottom: 40px;
        }

        .logo img {
            max-width: 200px;
            height: auto;
            margin-bottom: 20px;
        }

        .tagline {
            color: #1e3a8a;
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 50px;
            letter-spacing: 0.5px;
        }

        .button-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            padding: 16px 32px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            width: 100%;
        }

        .btn-desktop {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-desktop:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-app {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .btn-app:hover {
            background: #f8f9ff;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.2);
        }

        @media (max-width: 600px) {
            .container {
                padding: 40px 24px;
            }

            .tagline {
                font-size: 16px;
            }

            .btn {
                padding: 14px 24px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="./assets/enrol-me-logo.png" alt="Enrol Me Logo">
            <p class="tagline">Explore all you can be</p>
        </div>
        
        <div class="button-container">
            <button class="btn btn-desktop" onclick="window.location.href='./figma/index.html?mode=desktop'">
                👨‍💻 View in Desktop Mode
            </button>
            <button class="btn btn-app" onclick="window.location.href='./figma/index.html?mode=app'">
                📱 View in App Mode
            </button>
        </div>
    </div>
</body>
</html>
